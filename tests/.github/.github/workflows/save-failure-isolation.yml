
name: Save failure isolation tests

on:
  push:
    branches:
      - test/save-failure-isolation
  pull_request:
    branches:
      - test/save-failure-isolation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run save-failure isolation tests
        run: node --test tests/save-failure-isolation.test.js

